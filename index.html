<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>handynab</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <header>
    <h1>handynab</h1>
    <div id="auth">
      <span id="auth-status">Not connected to YNAB</span>
      <button id="connect" type="button">Connect YNAB</button>
      <button id="disconnect" type="button" class="secondary" hidden>Disconnect</button>
    </div>
  </header>
  <label id="drop">
    Choose a Handelsbanken CSV export, or drop it here.
    <input id="file" type="file" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel" hidden>
  </label>
  <p id="error" hidden></p>
  <section id="result" hidden>
    <div id="target" hidden>
      <label>Plan <select id="plan"></select></label>
      <label>Account <select id="account"></select></label>
      <button id="import" type="button" disabled>Import</button>
    </div>
    <p id="import-status" hidden></p>
    <div id="summary">
      <button id="download" type="button" class="secondary">Download YNAB CSV</button>
      <span id="counts"></span>
      <label id="show-source-label"><input id="show-source" type="checkbox"> Show bank columns</label>
    </div>
    <div class="table">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <details id="pending" hidden>
      <summary></summary>
      <p class="note">Not imported. They are imported once the bank has booked them.</p>
      <div class="table">
        <table>
          <thead id="pending-head"></thead>
          <tbody id="pending-rows"></tbody>
        </table>
      </div>
    </details>
    <details id="ignored" hidden>
      <summary></summary>
      <p class="note">Rows without a booking date and amount, such as totals and balances.</p>
      <ul id="ignored-rows"></ul>
    </details>
  </section>
</main>
</body>
</html>
