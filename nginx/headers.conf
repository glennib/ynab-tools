# Included in every location: add_header in a location discards the ones inherited from server.
add_header Content-Security-Policy "default-src 'self'; connect-src https://api.ynab.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
